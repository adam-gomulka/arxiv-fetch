name: arXiv astro-ph.CO feed

on:
  schedule:
    # 02:00 UTC daily. arXiv announces at 20:00 US Eastern (00:00 UTC), so this
    # runs after the day's announcement has landed. GitHub queues scheduled jobs
    # on a best-effort basis and they can be delayed by 10-30 minutes at busy
    # times; the fetch uses a 10-day rolling window, so a late or skipped run
    # loses nothing.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: arxiv-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch arXiv records
        env:
          ARXIV_CATEGORY: astro-ph.CO
          ARXIV_WINDOW_DAYS: "20"
        run: python fetch_arxiv.py

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          d = json.load(open("feed/astro-ph.CO.json"))
          print(f"{d['record_count']} records, complete={d['complete']}, "
                f"window {d['window_start']} to {d['window_end']}")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "arXiv feed: $(date -u +%Y-%m-%d)"
            git push
          fi
