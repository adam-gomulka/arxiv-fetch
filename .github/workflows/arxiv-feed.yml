name: arXiv astro-ph.CO feed

on:
  schedule:
    # 05:40 UTC daily. arXiv announces at 20:00 US Eastern and the RSS feeds
    # rebuild at midnight Eastern, which is 04:00 UTC in summer and 05:00 UTC
    # in winter. Running at 05:40 clears the rebuild year-round; the earlier
    # 02:40 slot would have read the previous day's feed every time. The odd
    # minute avoids the on-the-hour crush on shared runners.
    - cron: "40 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: arxiv-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch records
        env:
          ARXIV_CATEGORY: astro-ph.CO
          ARXIV_WINDOW_DAYS: "20"
          ARXIV_RETAIN_DAYS: "45"
          # The arXiv API refuses GitHub-hosted runner IPs with 429/503, so it
          # is not attempted by default. Set to "1" if running somewhere arXiv
          # will serve, e.g. a self-hosted runner on a home connection.
          ARXIV_TRY_API: "0"
        run: python fetch_arxiv.py

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          d = json.load(open("feed/astro-ph.CO.json"))
          print(f"{d['record_count']} retained "
                f"({d['fetched_this_run']} fetched, {d['added_this_run']} new, "
                f"{d['pruned_this_run']} pruned)")
          print(f"sources ok: {d['sources_ok']}")
          for name, r in d["sources"].items():
              note = "" if r["ok"] else f"  <-- {r.get('error','')}"
              print(f"  {name}: {r['records']} records{note}")
          print(f"retained span {d['oldest_retained']} -> {d['newest_retained']}")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "arXiv feed: $(date -u +%Y-%m-%d)"
            git push
          fi
