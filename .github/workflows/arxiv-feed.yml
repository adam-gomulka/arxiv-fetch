name: arXiv astro-ph.CO feed

on:
  schedule:
    # 02:40 UTC daily. arXiv announces at 20:00 US Eastern (00:00 UTC), so this
    # runs well after the day's announcement. The offset minute is deliberate:
    # on-the-hour crons are the busiest slots on shared runners, and the whole
    # problem here is contention on shared IPs. GitHub queues scheduled jobs
    # best-effort and they can be delayed; the 20-day window plus the merged
    # archive means a late or skipped run costs nothing.
    - cron: "40 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: arxiv-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # A single 429 backoff cycle can wait up to ~11 minutes before giving up.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch arXiv records
        env:
          ARXIV_CATEGORY: astro-ph.CO
          ARXIV_WINDOW_DAYS: "20"
          ARXIV_RETAIN_DAYS: "45"
        run: python fetch_arxiv.py

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          d = json.load(open("feed/astro-ph.CO.json"))
          print(f"{d['record_count']} retained "
                f"({d['fetched_this_run']} fetched, {d['added_this_run']} new, "
                f"{d['pruned_this_run']} pruned)")
          print(f"window {d['window_start']} -> {d['window_end']}, "
                f"complete={d['window_complete']}")
          print(f"retained span {d['oldest_retained']} -> {d['newest_retained']}")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "arXiv feed: $(date -u +%Y-%m-%d)"
            git push
          fi
